name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Azure after the checks pass
        type: boolean
        default: true

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: esg, POSTGRES_PASSWORD: esg, POSTGRES_DB: esg }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U esg" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://esg:esg@localhost:5432/esg
      EVIDENCE_DIR: ${{ runner.temp }}/evidence
      SEED_DEMO_DATA: "true"
      APP_SECRET: ci-secret
      ALERT_INTERVAL_SEC: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements*.txt" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: Tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term --cov-fail-under=70 --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: "junit.xml\ncoverage.xml" }

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements*.txt" }
      - run: pip install -r requirements-dev.txt
      - name: Python static analysis (bandit)
        run: bandit -r app -s B608 -ll
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Filesystem and IaC scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Bicep build
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  build:
    name: Build and scan image
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    name: Deploy to Azure and smoke test
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements*.txt" }
      - run: pip install -r requirements-dev.txt
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Locate app and current image
        run: |
          APP=$(az containerapp list -g "$RG" --query "[0].name" -o tsv)
          echo "APP=$APP" >> $GITHUB_ENV
          echo "PREV=$(az containerapp show -g "$RG" -n "$APP" --query 'properties.template.containers[0].image' -o tsv)" >> $GITHUB_ENV
          echo "FQDN=$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)" >> $GITHUB_ENV
      - name: Deploy new image
        run: az containerapp update -g "$RG" -n "$APP" --image "$IMAGE:${{ github.sha }}" -o none
      - name: Wait for healthy
        run: |
          for i in $(seq 1 60); do
            s=$(curl -fsS "https://$FQDN/api/health" 2>/dev/null | python -c 'import sys,json;print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)
            echo "health: ${s:-down}"; [ "$s" = "ok" ] && exit 0; sleep 10
          done
          exit 1
      - name: Smoke tests against Azure
        env:
          BASE_URL: https://${{ env.FQDN }}
        run: |
          DEMO_PASSWORD=$(az containerapp secret show -g "$RG" -n "$APP" --secret-name demo-password --query value -o tsv)
          echo "::add-mask::$DEMO_PASSWORD"
          export DEMO_PASSWORD
          pytest -p no:cacheprovider --junitxml=smoke.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-results, path: smoke.xml }
      - name: Roll back on failure
        if: failure()
        run: |
          echo "Rolling back to $PREV"
          az containerapp update -g "$RG" -n "$APP" --image "$PREV" -o none
